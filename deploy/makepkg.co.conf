SRCDEST=/var/cache/co/src
BUILDENV=(!distcc color ccache check !sign)
# Follow redirects. download.kde.org answers 302 with a short HTML body, and
# curl without -L saves that body and the checksum fails.
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfLC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
# /etc/makepkg.conf sets MAKEFLAGS to nproc. The queue exports CO_JOBS
# so a package build stays inside the cores it reserved.
if [[ -n ${CO_JOBS:-} ]]; then
  MAKEFLAGS="-j${CO_JOBS}"
fi
