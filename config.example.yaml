# Copy to ~/.config/co/config.yaml and edit. Do not commit that file.
url: http://127.0.0.1:8787
token: change-me
# local: build on this machine when the queue is down
# cancel: exit non-zero so the caller (topgrade) shows a failed step
fallback: local
# Threads for a strategy build. Keep this at or under the server's CO_CPUS.
# Two strategy builds run together when the threads fit.
# makepkg and AUR take every core the server allows, one package at a time.
jobs: 16
